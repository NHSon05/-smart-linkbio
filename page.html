<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link-in-Bio Page</title>
<!-- Bản thật: OG tags sinh sẵn lúc build cho từng slug -->
<meta property="og:title" content="Smart Link-in-Bio">
<link rel="stylesheet" href="assets/page.css">
<style>
  html,body{margin:0;min-height:100%}
  body{background:var(--lb-bg,#F7F7F7)}
  #app{min-height:100vh}
  .notfound{font:15px/1.6 "Sora",-apple-system,sans-serif;color:#8E8E89;text-align:center;padding:80px 20px}
  .notfound a{color:#282828}
  /* Thanh công cụ chỉ có ở bản demo (đặt trên cùng để không đè dock của trang) */
  .dbar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:10;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;
    max-width:calc(100% - 24px);background:rgba(255,255,255,.92);color:#282828;border-radius:99px;padding:5px;
    font:12px/1.3 "Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(40,40,40,.14)}
  .dbar select,.dbar button,.dbar a{font:inherit;color:#282828;background:#F3F3F0;border:0;border-radius:99px;padding:7px 12px;cursor:pointer;text-decoration:none}
  .dbar button:hover,.dbar a:hover{background:#E9E9E4}
  .dbar #viralBtn{background:#CBD77E}
  .dbar .tag{font-weight:600;padding:0 8px 0 10px;letter-spacing:.06em;font-size:10.5px}
  .toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-20px);opacity:0;transition:.25s;z-index:11;background:#282828;color:#fff;border-radius:99px;padding:10px 18px;
    font:12px/1.4 "Sora",-apple-system,sans-serif;max-width:calc(100% - 24px);box-shadow:0 10px 30px rgba(40,40,40,.3);pointer-events:none}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .embed .dbar{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="dbar" id="dbar">
  <span class="tag" id="verTag">DEMO</span>
  <select id="slugSel" aria-label="Chọn slug"></select>
  <select id="tplSel" aria-label="Template" title="Thử template khác (chỉ trong phiên xem, không lưu)"></select>
  <button id="viralBtn" type="button">🔥 Giả lập viral</button>
  <a id="editBtn" href="#">✎ Sửa</a>
  <a href="index.html">⌂ Hub</a>
</div>

<script src="data/templates.js"></script>
<script src="data/sites.js"></script>
<script src="data/products.js"></script>
<script src="assets/meta.js"></script>
<script src="assets/store.js"></script>
<script src="assets/versions.js"></script>
<script src="assets/render.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var sites = window["LINK_SITES"], LB = window.LinkBio, V = window.LinkVersions;
  var slugs = Object.keys(sites);
  var slug = params.get('slug') || slugs[0];
  var embed = params.get('embed') === '1';
  if (embed) document.body.classList.add('embed');

  // Nguồn dữ liệu (mô phỏng): mặc định = bản đã publish đang chạy;
  // ?draft=1 = bản nháp trong editor; ?v=N = 1 phiên bản cũ trong lịch sử.
  var site = null, label = '';
  if (params.get('draft') === '1') {
    try { var d = localStorage.getItem(V.DRAFT_PREFIX + slug); if (d) { site = JSON.parse(d); label = 'NHÁP'; } } catch (e) {}
  } else if (params.get('v')) {
    var ver = V.get(slug, params.get('v')); if (ver) { site = ver.json; label = 'v' + ver.v; }
  }
  if (!site && sites[slug]) { site = V.current(slug); label = 'v' + V.load(slug).current; }

  var app = document.getElementById('app');
  if (!site) {
    app.innerHTML = '<div class="notfound">Không có slug <b>' + slug.replace(/</g,'&lt;') + '</b>. <a href="index.html">Về hub</a></div>';
    return;
  }
  site = JSON.parse(JSON.stringify(site));
  document.title = (site.profile && site.profile.title || slug) + ' · Link-in-Bio';
  document.getElementById('verTag').textContent = 'DEMO · ' + label;

  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function draw(highlight){
    LB.render(site, app, {
      preventNav: true, // demo: chỉ hiện toast tracking, không mở link đích
      highlight: highlight,
      onTrack: function(p){
        toast('track → slug=' + p.slug + ' block=' + p.blockId + ' pos=' + p.position);
        console.log('[track]', p);
      }
    });
    document.body.style.setProperty('--lb-bg', LB.themeOf(site).bg || '#F7F7F7');
  }
  draw();

  // Toolbar
  var sel = document.getElementById('slugSel');
  slugs.forEach(function(s){ var o = document.createElement('option'); o.value = s; o.textContent = '/' + s; if (s === slug) o.selected = true; sel.appendChild(o); });
  sel.addEventListener('change', function(){ location.search = '?slug=' + encodeURIComponent(sel.value); });
  document.getElementById('editBtn').href = 'editor.html?slug=' + encodeURIComponent(slug);

  // Thử nhanh template khác (chỉ trong phiên xem). Block không hợp lệ ở vùng mới sẽ bị ẩn theo allow.
  var tplSel = document.getElementById('tplSel'), T = window.LINK_TEMPLATES;
  Object.keys(T).forEach(function(id){ var o = document.createElement('option'); o.value = id; o.textContent = '▦ ' + T[id].name; tplSel.appendChild(o); });
  tplSel.value = LB.templateOf(site).id;
  tplSel.addEventListener('change', function(){ site.template = tplSel.value; draw(); toast('Template: ' + T[tplSel.value].name + ' (không lưu)'); });

  // Mô phỏng n8n: 1 content trong vùng main bỗng tăng view mạnh → score cao nhất → lên đầu vùng main
  document.getElementById('viralBtn').addEventListener('click', function(){
    if (!LB.rankOf(site, 'main')) { toast('Vùng main đang giữ thứ tự kéo thả (tắt Tự xếp), viral score không đổi thứ tự'); return; }
    var ids = (LB.layoutOf(site).main || {}).blocks || [];
    var cands = site.blocks.filter(function(b){ return ids.indexOf(b.id) >= 0 && !b.pinned && !b.hidden; });
    if (cands.length < 2) { toast('Vùng main cần ít nhất 2 block để thấy đổi thứ tự'); return; }
    var ranked = LB.regionBlocks(site, 'main');
    var top = ranked.filter(function(b){ return !b.pinned; })[0];
    var others = cands.filter(function(b){ return b !== top; });
    var pick = others[Math.floor(Math.random() * others.length)];
    var max = Math.max.apply(null, cands.map(function(b){ return typeof b.score === 'number' ? b.score : 0; }));
    pick.score = max + 5;
    draw(pick.id);
    var node = app.querySelector('[data-block-id="' + pick.id + '"]');
    if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('n8n: "' + (pick.text || pick.title || pick.id) + '" tăng tốc view → score ' + pick.score + ' (xếp trong vùng main)');
  });
})();
</script>
</body>
</html>
